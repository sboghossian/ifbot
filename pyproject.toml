[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ifbot"
version = "0.1.0"
description = "A tiny rules-only chatbot and a harness for growing it by hill-climbing a benchmark."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
ifbot = "ifbot.cli:main"

[tool.setuptools.packages.find]
include = ["ifbot*"]
